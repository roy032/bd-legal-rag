name: Release

# On a published GitHub release: build the image and attach its software bill of
# materials (SPDX and CycloneDX, generated by syft) to the release, so anyone
# running it can check the packages inside against new advisories.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bd-legal-rag:release
          cache-from: type=gha
      - uses: anchore/sbom-action@v0
        with:
          image: bd-legal-rag:release
          format: spdx-json
          output-file: bd-legal-rag.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@v0
        with:
          image: bd-legal-rag:release
          format: cyclonedx-json
          output-file: bd-legal-rag.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" bd-legal-rag.spdx.json bd-legal-rag.cdx.json --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: bd-legal-rag.*.json
