name: CI

on:
  push: { branches: [main] }
  pull_request:

# A new push to a pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows, and the one the image ships.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[serve,dev,qdrant,otel]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Type check
        run: mypy

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m --fail-under=80

      # The quality gate. Runs on the bundled sample corpus so CI needs no
      # scraped data and no model download. Each metric is compared question by
      # question with the committed baseline (paired bootstrap), not just a floor.
      - name: Build sample index
        run: |
          python scripts/build_index.py --chunks data/sample/chunks.jsonl \
            --out data/sample/index --embedder hashing --bm25

      - name: Retrieval quality gate
        run: |
          for metric in recall@5 mrr ndcg@5; do
            python scripts/ci_eval_gate.py \
              --eval data/eval/sample_eval.jsonl --chunks data/sample/chunks.jsonl \
              --index data/sample/index --embedder hashing --mode hybrid --expand-refs \
              -k 5 --metric "$metric" --baseline results/baselines/sample.json --tolerance 0.03
          done

      - name: Adversarial suite (injection, romanised input, typos)
        run: |
          python scripts/eval_e2e.py --eval data/eval/adversarial.jsonl \
            --chunks data/sample/chunks.jsonl --index data/sample/index \
            --embedder hashing --provider echo --no-judge --label ci-adversarial \
            --results /tmp/results -k 3

      - name: Red team (injection and personal data, Bangla, English, romanised)
        run: python scripts/redteam.py --json-out /tmp/results/redteam.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[serve]" pip-audit
      # Advisory: a new CVE in a transitive dependency should be seen, not block
      # every unrelated pull request. Dependabot opens the upgrade.
      - run: pip-audit --strict --progress-spinner off || true

  # Build the production image, start it on the sample index, and hold it to a
  # latency SLO: the image must boot, pass its readiness probe, serve /search under
  # load, degrade /ask to retrieval when no model is configured, and log JSON.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bd-legal-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sample index
        run: |
          pip install -e .
          python scripts/build_index.py --chunks data/sample/chunks.jsonl \
            --out /tmp/index --embedder hashing --bm25
          chmod -R a+rX /tmp/index

      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 -v /tmp/index:/app/data/index:ro \
            -e RAG_LLM=echo -e LOG_FORMAT=json \
            -e BDRAG_RATE_PER_MIN=100000 -e BDRAG_BURST=1000 bd-legal-rag:ci
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/readyz; then echo; break; fi
            sleep 2
          done
          curl -fsS localhost:8000/readyz
          curl -fsS localhost:8000/livez

      - name: Load test with SLO (/search)
        run: |
          PYTHONPATH=src python scripts/loadtest.py --url http://localhost:8000/search \
            --concurrency 8 --requests 400 --slo-p95-ms 1000 --max-error-rate 0 \
            --json-out /tmp/load.json

      - name: Degraded answer, headers and logs
        run: |
          code=$(curl -s -o /tmp/ask.json -w '%{http_code}' -X POST localhost:8000/ask \
            -H 'content-type: application/json' -d '{"question":"বীমা আইনের সংক্ষিপ্ত শিরোনাম কী?"}')
          test "$code" = 503
          python -c "import json; d=json.load(open('/tmp/ask.json')); assert d['degraded'] and d['sources'], d"
          curl -sSI localhost:8000/livez | grep -i '^content-security-policy'
          curl -fsS localhost:8000/metrics | grep -q 'request_seconds_bucket{path="/search"'
          docker logs api 2>&1 | grep '"route": "/search"' | head -1 | python -c "import json,sys; json.loads(sys.stdin.read())"

      - name: Container logs
        if: failure()
        run: docker logs api 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest
          path: /tmp/load.json
          if-no-files-found: ignore
