name: CI

on:
  push: { branches: [main] }
  pull_request:

# A new push to a pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows, and the one the image ships.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[serve,dev,qdrant,otel]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Type check
        run: mypy

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m --fail-under=80

      # The quality gate. Runs on the bundled sample corpus so CI needs no
      # scraped data and no model download. Each metric is compared question by
      # question with the committed baseline (paired bootstrap), not just a floor.
      - name: Build sample index
        run: |
          python scripts/build_index.py --chunks data/sample/chunks.jsonl \
            --out data/sample/index --embedder hashing --bm25

      - name: Retrieval quality gate
        run: |
          for metric in recall@5 mrr ndcg@5; do
            python scripts/ci_eval_gate.py \
              --eval data/eval/sample_eval.jsonl --chunks data/sample/chunks.jsonl \
              --index data/sample/index --embedder hashing --mode hybrid --expand-refs \
              -k 5 --metric "$metric" --baseline results/baselines/sample.json --tolerance 0.03
          done

      - name: Adversarial suite (injection, romanised input, typos)
        run: |
          python scripts/eval_e2e.py --eval data/eval/adversarial.jsonl \
            --chunks data/sample/chunks.jsonl --index data/sample/index \
            --embedder hashing --provider echo --no-judge --label ci-adversarial \
            --results /tmp/results -k 3

      - name: Red team (injection and personal data, Bangla, English, romanised)
        run: python scripts/redteam.py --json-out /tmp/results/redteam.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[serve]" pip-audit
      # Advisory: a new CVE in a transitive dependency should be seen, not block
      # every unrelated pull request. Dependabot opens the upgrade.
      - run: pip-audit --strict --progress-spinner off || true

  # Build the production image, start it on the sample index, and hold it to a
  # latency SLO: the image must boot, pass its readiness probe, serve /search under
  # load, degrade /ask to retrieval when no model is configured, and log JSON.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bd-legal-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sample index
        run: |
          pip install -e .
          python scripts/build_index.py --chunks data/sample/chunks.jsonl \
            --out /tmp/index --embedder hashing --bm25
          chmod -R a+rX /tmp/index

      # Hardened as in production: read-only root filesystem, no capabilities, no
      # privilege escalation. Only /tmp and the log directory are writable.
      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 -v /tmp/index:/app/data/index:ro \
            --read-only --tmpfs /tmp:size=64m \
            --tmpfs /app/data/logs:size=16m,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e BDRAG_FEEDBACK=/app/data/logs/feedback.jsonl \
            -e BDRAG_ANALYTICS=/app/data/logs/queries.jsonl \
            -e BDRAG_ANSWERS_DB=/app/data/logs/answers.sqlite3 \
            -e RAG_LLM=echo -e LOG_FORMAT=json \
            -e BDRAG_RATE_PER_MIN=100000 -e BDRAG_BURST=1000 bd-legal-rag:ci
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/readyz; then echo; break; fi
            sleep 2
          done
          curl -fsS localhost:8000/readyz
          curl -fsS localhost:8000/livez

      - name: Load test with SLO (/search)
        run: |
          PYTHONPATH=src python scripts/loadtest.py --url http://localhost:8000/search \
            --concurrency 8 --requests 400 --slo-p95-ms 1000 --max-error-rate 0 \
            --json-out /tmp/load.json

      - name: Synthetic probe (the uptime workflow's check)
        run: |
          python scripts/probe.py --url http://localhost:8000 \
            --canary "বীমা আইনের সংক্ষিপ্ত শিরোনাম কী?" --json-out /tmp/probe.json

      - name: Degraded answer, headers and logs
        run: |
          code=$(curl -s -o /tmp/ask.json -w '%{http_code}' -X POST localhost:8000/ask \
            -H 'content-type: application/json' -d '{"question":"বীমা আইনের সংক্ষিপ্ত শিরোনাম কী?"}')
          test "$code" = 503
          python -c "import json; d=json.load(open('/tmp/ask.json')); assert d['degraded'] and d['sources'], d"
          curl -sSI localhost:8000/livez | grep -i '^content-security-policy'
          curl -fsS localhost:8000/metrics | grep -q 'request_seconds_bucket{path="/search"'
          docker logs api 2>&1 | grep '"route": "/search"' | head -1 | python -c "import json,sys; json.loads(sys.stdin.read())"

      - name: Read-only root filesystem, and personal data never stored
        run: |
          if docker exec api sh -c 'touch /app/probe' 2>/dev/null; then
            echo "the root filesystem is writable"; exit 1
          fi
          curl -fsS -X POST localhost:8000/feedback -H 'content-type: application/json' \
            -d '{"id":"x","rating":"down","comment":"call me on 01712345678"}'
          docker exec api cat /app/data/logs/feedback.jsonl | grep -q '\[phone\]'
          ! docker exec api grep -q 01712345678 /app/data/logs/feedback.jsonl
          ! docker logs api 2>&1 | grep -q 'could not append'
          # Shared answers go to the mounted directory, so links survive a restart.
          curl -fsS localhost:8000/stats | python -c "import json,sys; assert json.load(sys.stdin)['shared_answers']['durable']"

      # Software bill of materials for the image: every OS and Python package in it.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: bd-legal-rag:ci
          format: spdx-json
          output-file: /tmp/sbom.spdx.json
          upload-artifact: false

      - name: Container logs
        if: failure()
        run: docker logs api 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-and-sbom
          path: |
            /tmp/load.json
            /tmp/sbom.spdx.json
          if-no-files-found: ignore

  # The alert rules are code: they must parse, and the unit tests in alerts.test.yml
  # (a fast error burn pages, a loading /readyz does not, a stale index tickets) pass.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check and test
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v2.53.2 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v2.53.2 check config prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v2.53.2 test rules alerts.test.yml

  # The UI is the product for most visitors: axe-core (WCAG 2.1 AA) on the home
  # page, settings and an answer, in Bangla and English, light and dark, plus a
  # keyboard-only pass. A canned model on the test corpus; nothing downloaded.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # dev: the fixture server reuses the test suite's components (starlette's TestClient needs httpx2).
      - run: pip install -e ".[serve,dev]"
      - run: |
          npm i --no-save playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: axe and keyboard checks
        run: |
          python tests/a11y/serve.py --port 8765 &
          for i in $(seq 1 30); do curl -fsS localhost:8765/livez && break; sleep 1; done
          curl -fsS localhost:8765/livez
          node tests/a11y/axe.mjs http://127.0.0.1:8765
