[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-legal-rag"
version = "1.0.0"
description = "Bilingual (Bangla + English) RAG over the statutes of Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
serve = ["starlette>=0.37", "uvicorn[standard]>=0.30"]
qdrant = ["qdrant-client>=1.9"]
llm = ["anthropic>=0.39", "openai>=1.40"]
redis = ["redis>=5.0"]
dev = ["ruff>=0.6", "mypy>=1.11", "coverage>=7.6", "pip-audit>=2.7"]

[project.scripts]
bdrag = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
files = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/static/*"]
