services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      RAG_LLM: ${RAG_LLM:-ollama}
      RAG_MODEL: ${RAG_MODEL:-gemma4:e4b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Free hosted models, only if you opt in (questions leave the machine):
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BDRAG_MODE: dense
      BDRAG_RATE_PER_MIN: "20"
      BDRAG_MAX_INFLIGHT: ${BDRAG_MAX_INFLIGHT:-2}
      LOG_FORMAT: json
      REDIS_URL: ${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Nothing in the image is written at runtime: the index, feedback and query logs
    # live in ./data and the model cache in its volume, both mounted below.
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    volumes:
      - ./data:/app/data          # the index lives outside the image
      - hf-cache:/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: swap NumpyStore for Qdrant once the corpus outgrows brute force.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["qdrant"]
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  # Optional: shared cache and rate limits when you run more than one api replica
  # (`docker compose --profile redis up`, then REDIS_URL=redis://redis:6379/0).
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  hf-cache:
  qdrant:
